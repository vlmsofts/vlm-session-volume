# Railway service config -- ice_timesales_engine (API + UI).
# Required env vars on Railway: DATABASE_URL (Supabase Postgres),
# CF_ZONE_ID / CF_API_TOKEN (optional, edge purge).
# NOTE: ingest jobs run on the Windows box (they read C:\Ice eod records\);
# Railway only serves queries from the DB.

[build]
builder = "nixpacks"

[deploy]
startCommand = "gunicorn 'api.app:create_app()' --bind 0.0.0.0:$PORT --workers 2"
healthcheckPath = "/health"
restartPolicyType = "on_failure"
